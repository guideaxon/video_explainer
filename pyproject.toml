[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-explainer"
version = "0.1.0"
description = "Generate high-quality explainer videos from technical content"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Prajwal"}
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "edge-tts>=6.0",
    "numpy>=1.21.0",
    "scipy>=1.11",  # src/sound/generator.py (SFX filters); `import src.sound` fails without it
    "pillow>=10.0",  # Demo style bundle: decode screenshots, read their size, downsample for colour analysis
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
whisper = [
    "openai-whisper>=20231117",
]
# Optional, better SFX (docs/SOUND.md). About 1.2 GB (PyTorch CPU). Not the PyPI package named "earshot",
# which is an unrelated voice-activity detector, so install from the repo, pinned to the tested commit.
earshot = [
    "earshot @ git+https://github.com/Leonxlnx/earshot@925ebe56a1b755e5d354ab642bb8f344440cfa9c",
]

[project.scripts]
video-explainer = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (require network, deselect with '-m not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
