<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Studio</title>
    <link rel="icon" href="data:," />
    <!-- Set the theme before first paint so dark-mode users do not see a light flash. Mirrors prefs.ts. -->
    <script>
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem("video-studio-prefs") || "{}").theme || "system";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePref = pref;
        } catch (e) { /* storage blocked: the default light theme applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
